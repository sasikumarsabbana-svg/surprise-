<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3B7D0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#351126" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBD6B7"/>
      <stop offset="100%" stop-color="#F3BD92"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#781D48"/>
      <stop offset="100%" stop-color="#4F0E2D"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1C1E"/>
      <stop offset="100%" stop-color="#15090B"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="180" r="130" fill="url(#glow)"/>

  <!-- Door Edge Reference / Wall outline -->
  <line x1="210" y1="10" x2="210" y2="390" stroke="#F5D061" stroke-width="4" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Peeking Character leaning in from left -->
  <g id="character-peek" transform="rotate(-8 140 180)">
    <!-- Peeking Body -->
    <path d="M70 200 Q120 180 180 190 L190 320 Q120 330 60 310 Z" fill="url(#jacket)"/>
    <path d="M100 195 L125 250 L145 195 Z" fill="#FFF1E8"/>

    <!-- Left hand gripping door frame -->
    <path d="M160 210 Q190 200 212 180" fill="none" stroke="url(#jacket)" stroke-width="20" stroke-linecap="round"/>
    <!-- Fingers gripping edge -->
    <ellipse cx="214" cy="176" rx="9" ry="7" fill="url(#skin)"/>
    <ellipse cx="215" cy="188" rx="8" ry="6" fill="url(#skin)"/>
    <ellipse cx="212" cy="199" rx="7" ry="6" fill="url(#skin)"/>

    <!-- Neck -->
    <rect x="110" y="145" width="26" height="30" rx="6" fill="url(#skin)" transform="rotate(-5 120 160)"/>

    <!-- Head tilted sideways playfully -->
    <g transform="translate(15, 10)">
      <ellipse cx="120" cy="115" rx="48" ry="52" fill="url(#skin)"/>
      <ellipse cx="70" cy="118" rx="10" ry="14" fill="url(#skin)"/>
      <ellipse cx="170" cy="118" rx="10" ry="14" fill="url(#skin)"/>

      <!-- Hair -->
      <path d="M66 110 C66 60 110 45 120 45 C150 45 175 65 174 110 C164 95 155 90 140 92 C120 85 100 92 85 88 C75 92 70 100 66 110 Z" fill="url(#hair)"/>
      <path d="M115 48 Q125 30 145 35 Q130 48 120 50 Z" fill="url(#hair)"/>

      <!-- Eyeglasses tilted -->
      <rect x="84" y="102" width="30" height="24" rx="7" fill="none" stroke="#221124" stroke-width="4"/>
      <rect x="126" y="102" width="30" height="24" rx="7" fill="none" stroke="#221124" stroke-width="4"/>
      <line x1="114" y1="112" x2="126" y2="112" stroke="#221124" stroke-width="4"/>

      <!-- Big playful winking or wide eyes -->
      <ellipse cx="99" cy="114" rx="6" ry="7" fill="#1C0912"/>
      <circle cx="101" cy="111" r="2.5" fill="#FFFFFF"/>
      <!-- Right eye winking cheeky curve -->
      <path d="M136 116 Q143 108 150 116" fill="none" stroke="#1C0912" stroke-width="4" stroke-linecap="round"/>

      <!-- Blushing Cheeks -->
      <circle cx="88" cy="128" r="8" fill="#F3B7D0" opacity="0.7"/>
      <circle cx="152" cy="128" r="8" fill="#F3B7D0" opacity="0.7"/>

      <!-- Grin -->
      <path d="M106 132 Q122 152 140 134" fill="#681534" stroke="#681534" stroke-width="3" stroke-linecap="round"/>
      <!-- White tooth spark -->
      <rect x="117" y="133" width="8" height="5" rx="2" fill="#FFFFFF"/>

      <!-- Eyebrows (One raised curiously) -->
      <path d="M90 92 Q100 84 110 92" fill="none" stroke="#1C0912" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M130 96 Q140 92 150 97" fill="none" stroke="#1C0912" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
