<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3B7D0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#351126" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBD6B7"/>
      <stop offset="100%" stop-color="#F3BD92"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#781D48"/>
      <stop offset="100%" stop-color="#4F0E2D"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1C1E"/>
      <stop offset="100%" stop-color="#15090B"/>
    </linearGradient>
    <linearGradient id="giftBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061"/>
      <stop offset="100%" stop-color="#D49B24"/>
    </linearGradient>
  </defs>

  <circle cx="150" cy="200" r="140" fill="url(#glow)"/>
  <ellipse cx="150" cy="380" rx="75" ry="14" fill="#1B0713" opacity="0.6"/>

  <!-- Character Group: Holding Gift Box -->
  <g id="character-gift">
    <!-- Legs -->
    <rect x="118" y="270" width="26" height="85" rx="12" fill="#201124"/>
    <rect x="156" y="270" width="26" height="85" rx="12" fill="#201124"/>
    <ellipse cx="128" cy="360" rx="20" ry="10" fill="#FFF1E8"/>
    <ellipse cx="172" cy="360" rx="20" ry="10" fill="#FFF1E8"/>

    <!-- Torso -->
    <path d="M100 170 Q150 155 200 170 L210 280 Q150 290 90 280 Z" fill="url(#jacket)"/>
    <path d="M130 165 L150 230 L170 165 Z" fill="#FFF1E8"/>

    <!-- Neck & Head -->
    <rect x="138" y="140" width="24" height="30" rx="6" fill="url(#skin)"/>
    <ellipse cx="150" cy="115" rx="48" ry="52" fill="url(#skin)"/>
    <ellipse cx="100" cy="118" rx="10" ry="14" fill="url(#skin)"/>
    <ellipse cx="200" cy="118" rx="10" ry="14" fill="url(#skin)"/>

    <!-- Hair -->
    <path d="M96 110 C96 60 140 45 150 45 C180 45 205 65 204 110 C194 95 185 90 170 92 C150 85 130 92 115 88 C105 92 100 100 96 110 Z" fill="url(#hair)"/>
    <path d="M145 48 Q155 30 175 35 Q160 48 150 50 Z" fill="url(#hair)"/>

    <!-- Glasses -->
    <rect x="114" y="102" width="30" height="24" rx="7" fill="none" stroke="#221124" stroke-width="4"/>
    <rect x="156" y="102" width="30" height="24" rx="7" fill="none" stroke="#221124" stroke-width="4"/>
    <line x1="144" y1="112" x2="156" y2="112" stroke="#221124" stroke-width="4"/>

    <!-- Warm Affectionate Smiling Eyes -->
    <ellipse cx="129" cy="114" rx="5" ry="6" fill="#1C0912"/>
    <ellipse cx="171" cy="114" rx="5" ry="6" fill="#1C0912"/>
    <circle cx="131" cy="111" r="2" fill="#FFFFFF"/>
    <circle cx="173" cy="111" r="2" fill="#FFFFFF"/>

    <!-- Cheeks (Blushing) -->
    <circle cx="118" cy="128" r="8" fill="#F3B7D0" opacity="0.65"/>
    <circle cx="182" cy="128" r="8" fill="#F3B7D0" opacity="0.65"/>

    <!-- Sweet Smile -->
    <path d="M136 132 Q150 148 164 132" fill="none" stroke="#681534" stroke-width="4" stroke-linecap="round"/>

    <!-- Arms brought forward holding gift -->
    <path d="M98 185 Q95 240 120 250" fill="none" stroke="url(#jacket)" stroke-width="20" stroke-linecap="round"/>
    <path d="M202 185 Q205 240 180 250" fill="none" stroke="url(#jacket)" stroke-width="20" stroke-linecap="round"/>

    <!-- The Beautiful Birthday Gift Box -->
    <g transform="translate(105, 205)">
      <!-- Box base -->
      <rect x="0" y="20" width="90" height="65" rx="8" fill="url(#giftBox)" stroke="#B37D14" stroke-width="2"/>
      <!-- Ribbon vertical -->
      <rect x="36" y="20" width="18" height="65" fill="#781D48"/>
      <!-- Lid -->
      <rect x="-5" y="10" width="100" height="16" rx="5" fill="#FDE18B" stroke="#B37D14" stroke-width="2"/>
      <rect x="36" y="10" width="18" height="16" fill="#781D48"/>
      <!-- Big Fluffy Ribbon Bow -->
      <ellipse cx="34" cy="5" rx="14" ry="8" fill="#9E225D" transform="rotate(-25 34 5)"/>
      <ellipse cx="56" cy="5" rx="14" ry="8" fill="#9E225D" transform="rotate(25 56 5)"/>
      <circle cx="45" cy="8" r="6" fill="#F3B7D0"/>
      <!-- Sparkles around gift -->
      <polygon points="10,2 12,8 18,10 12,12 10,18 8,12 2,10 8,8" fill="#FFF1E8"/>
      <polygon points="85,5 87,9 91,10 87,11 85,15 83,11 79,10 83,9" fill="#FFF1E8"/>
    </g>

    <!-- Hands resting on sides of gift box -->
    <circle cx="112" cy="245" r="11" fill="url(#skin)"/>
    <circle cx="188" cy="245" r="11" fill="url(#skin)"/>
  </g>
</svg>
